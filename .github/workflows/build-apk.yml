name: Build NodePoolManager APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.4 & Build
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Assemble Debug APK
      run: |
        gradle assembleDebug --no-daemon -Dkotlin.jvm.target.validation.mode=ignore -x lint -x test

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NodePoolManager-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
